name: Ping Streamlit App

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'  
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://pgautam-healthcare-limited.streamlit.app/
